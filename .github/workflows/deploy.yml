name: AI server CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "chat_test/**"
      - "docs/**"
      - "archive/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "chat_test/**"
      - "docs/**"
      - "archive/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 단위 테스트는 Gemini·ChromaDB·임베딩 모델을 가짜 객체로 대신하므로 가벼운 의존성만 설치
      - name: Install test dependencies
        run: pip install python-dotenv

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to EC2 (SSM)
    needs: test
    # 배포는 main 반영(push)·수동 실행 때만. PR 에서는 테스트만 실행
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run deploy script on EC2 (SSM)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters 'commands=["bash /opt/spoilock-ai/deploy/deploy.sh"]' \
            --query Command.CommandId --output text)
          echo "command: $CMD_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "status: $STATUS"
          [ "$STATUS" = "Success" ]
